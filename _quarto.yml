project:
  type: website
  output-dir: docs

  resources:
    - images/**
    - documentos/**
    - script.js
    - cart.js
    - checkout.js
    - checkout.css

website:
  title: "Rumbo Corcel"
  favicon: images/logo.PNG

  navbar:
    background: "#22302A"
    foreground: "#F2E8D9"
    pinned: true

    left:
      - href: index.qmd
        text: Inicio

      - href: catalogo.qmd
        text: Catálogo

      - href: novedades.qmd
        text: Novedades

      - href: nosotros.qmd
        text: Nosotros

    right:
      - icon: whatsapp
        href: "https://wa.me/message/5PEO6Z2GUZLNP1"
        aria-label: WhatsApp
        target: _blank
        
      - icon: instagram
        href: https://www.instagram.com/rumbocorcel.mate
        aria-label: Instagram
        target: _blank
        rel: noopener noreferrer

      - icon: facebook
        href: https://www.facebook.com/profile.php?id=61586241693849
        aria-label: Facebook
        target: _blank
        rel: noopener noreferrer
        
      - icon: tiktok
        href: https://www.tiktok.com/@rumbo.corcel?_r=1&_t=ZS-98ajOG4A2y7
        aria-label: TikTok
        target: _blank
        rel: noopener noreferrer

  page-footer:
    background: "#22302A"
    foreground: "#F2E8D9"

    left: "© 2026 Rumbo Corcel · Luis Cuevas "

    center:
      - text: "Privacidad"
        href: politica-privacidad.qmd

      - text: "Términos"
        href: terminos-condiciones.qmd

      - text: "Cambios y devoluciones"
        href: cambios-devoluciones.qmd

    right:
      - text: "WhatsApp"
        href: "https://wa.me/message/5PEO6Z2GUZLNP1"

format:
  html:
    lang: es
    theme: cosmo
    css: 
    - styles.css
    - legal-pages.css
    toc: false
    smooth-scroll: true
    anchor-sections: false

    include-in-header: includes/analytics.html
    include-after-body: includes/after-body.html