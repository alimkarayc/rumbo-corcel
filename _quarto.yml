project:
  type: website
  output-dir: docs

  resources:
    - images/**
    - documentos/**
    - script.js
    - cart.js

website:
  title: "Rumbo Corcel"
  favicon: images/logo.jpeg

  navbar:
    background: "#22302A"
    foreground: "#F2E8D9"
    pinned: true

    left:
      - href: index.qmd
        text: Inicio

      - href: catalogo.qmd
        text: Catálogo

      - href: nosotros.qmd
        text: Nosotros

    right:
      - icon: whatsapp
        href: "https://wa.me/56962590678?text=Hola%20Rumbo%20Corcel%2C%20quiero%20consultar%20por%20sus%20productos."
        aria-label: WhatsApp
        target: _blank
        
      - icon: instagram
        href: https://www.instagram.com/rumbocorcel.mate
        aria-label: Instagram

      - icon: facebook
        href: https://www.facebook.com/profile.php?id=61586241693849
        aria-label: Facebook

  page-footer:
    background: "#22302A"
    foreground: "#F2E8D9"
    left: "© 2026 Rumbo Corcel"

    right:
      - text: "WhatsApp"
        href: https://wa.me/56962590678

format:
